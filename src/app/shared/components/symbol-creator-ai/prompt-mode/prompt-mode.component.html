<div *ngIf="showPrompt" class="floating-prompt">
  <h3 style="font-weight: 400;margin-bottom: 3px;">{{ fullPrompt || 'No prompt generated yet' }}</h3>
  <button mat-icon-button style="width: 100%; text-align: right;" *ngIf="fullPrompt" (click)="copyPrompt()" aria-label="Copy prompt" matTooltip="Copy to clipboard">
    <mat-icon>content_copy</mat-icon>
  </button>
</div>

<app-ai-image-gallery
  [generatedImages]="generatedImages"
  [selectedImageIndex]="selectedImageIndex"
  [isGenerated]="isGenerated"
  [showImages]="showImages"
  [isLoading]="isLoading"
  [isRefreshing]="isRefreshing"
  [apiError]="apiError"
  [showApiError]="showApiError"
  (imageSelected)="selectImage($event)"
  (expandDone)="onExpandDone($event)"
  (retryRequested)="onSubmit()">
</app-ai-image-gallery>

<!-- Enlarged selected image section -->
<div *ngIf="selectedImageIndex !== null" class="selected-image mb-3" [@expandSelected]>
  <div class="image-and-details">
    <div class="enlarged-placeholder"
         [style.background-image]="'url(' + selectedImageUrl + ')'"
         [style.background-size]="'cover'"
         [style.background-position]="'center'">
    </div>

    <app-ai-rating-system
      [rating]="rating"
      [promptAccuracy]="promptAccuracy"
      [styleAccuracy]="styleAccuracy"
      [showDetailedRatings]="showDetailedRatings"
      (ratingChanged)="setRating($event)"
      (promptAccuracyChanged)="setPromptAccuracy($event)"
      (styleAccuracyChanged)="setStyleAccuracy($event)">
    </app-ai-rating-system>

  </div>

  <app-ai-image-actions
    [selectedImageUrl]="selectedImageUrl"
    (saveRequested)="onSave()"
    (downloadRequested)="downloadPng()"
    (importToDesignerRequested)="importToDesigner()"
    (closeRequested)="closeSelected()">
  </app-ai-image-actions>
</div>

<mat-form-field style="width:100%" appearance="fill">
  <textarea matInput placeholder="Describe your symbol" [(ngModel)]="prompt"></textarea>
</mat-form-field>

<div class="controls-row">
  <mat-form-field appearance="outline" class="control-item">
    <mat-label>Style</mat-label>
    <mat-select [(ngModel)]="selectedStyle" name="style">
    <mat-option *ngFor="let style of availableStyles" [value]="style">
      {{ style }}
    </mat-option>
  </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="control-item">
    <mat-label>Culture</mat-label>
    <input matInput [(ngModel)]="additionalText">
  </mat-form-field>

  <mat-slide-toggle [(ngModel)]="backgroundEnabled" class="control-item">White Background</mat-slide-toggle>

  <!-- <mat-slide-toggle class="control-item">Person???</mat-slide-toggle> -->
</div>

<button mat-raised-button color="primary" (click)="onSubmit()" class="mt-1" [disabled]="prompt.length < 1">Generate Images</button>  <!-- NEW: Added [disabled] binding -->
