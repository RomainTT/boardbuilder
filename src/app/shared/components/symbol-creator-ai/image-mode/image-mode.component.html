<!-- AI generated variations gallery -->
<app-ai-image-gallery
  [generatedImages]="generatedImages"
  [selectedImageIndex]="selectedImageIndex"
  [isGenerated]="isGenerated"
  [showImages]="showImages"
  [isLoading]="isLoading"
  [isRefreshing]="isRefreshing"
  [apiError]="apiError"
  [showApiError]="showApiError"
  (imageSelected)="selectImage($event)"
  (expandDone)="onExpandDone($event)"
  (retryRequested)="generateImageVariations()">
</app-ai-image-gallery>

<!-- Selected generated image section -->
<app-ai-selected-image
  [selectedImageIndex]="selectedImageIndex"
  [selectedImageUrl]="selectedImageUrl"
  (saveRequested)="onSave()"
  (downloadRequested)="downloadPng()"
  (importToDesignerRequested)="importToDesigner()"
  (closeRequested)="closeSelected()">
</app-ai-selected-image>


<!-- Image Upload Section -->
<div *ngIf="!uploadedImageData" class="upload-section">
  <app-image-upload-dialog (imageUploaded)="onImageUploaded($event)"></app-image-upload-dialog>
</div>

<!-- Original uploaded image display -->
<div *ngIf="uploadedImageData" class="original-image-section">
  <div class="original-image-container">
    <img [src]="originalImageUrl" alt="Original uploaded image" class="original-image">
    <div class="image-info">
      <p><strong>{{ uploadedImageData?.file.name }}</strong></p>
      <p>{{ uploadedImageData?.width }}x{{ uploadedImageData?.height }}px</p>
      <button mat-icon-button (click)="clearUploadedImage()" matTooltip="Upload different image">
        <mat-icon>edit</mat-icon>
      </button>
    </div>
  </div>
</div>

<!-- AI Controls -->
<app-ai-controls
  [selectedStyle]="selectedStyle"
  [availableStyles]="availableStyles"
  [additionalText]="additionalText"
  [backgroundEnabled]="backgroundEnabled"
  [generateButtonText]="'Generate Variations'"
  [generateButtonDisabled]="!uploadedImageData"
  (styleChanged)="onStyleChanged($event)"
  (additionalTextChanged)="onAdditionalTextChanged($event)"
  (backgroundEnabledChanged)="onBackgroundEnabledChanged($event)"
  (generateClicked)="onGenerateClicked()">
</app-ai-controls>
