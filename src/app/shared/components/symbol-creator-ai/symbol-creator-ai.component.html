<!-- Mode navigation modules -->

<div class="mt-2" *ngIf="currentMode === Mode.Prompt">
  <app-text-mode [initialPrompt]="promptText" (saveRequested)="onSaveRequested($event)" [parentDialogRef]="parentDialogRef" [accessPoint]="accessPoint"></app-text-mode>
</div>
