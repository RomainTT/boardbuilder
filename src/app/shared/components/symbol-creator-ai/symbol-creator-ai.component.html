<!-- AI lanading -->

<!-- Default content: Shown when no mode is selected (intro) -->
<div *ngIf="!currentMode" class="text-center">
  <h1 class="mb-5" style="display: inline-block;">Getting Started with Symbol Creator AI</h1>
  <!-- <h3 class="mb-3">Choose your input</h3> -->
   
  <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="20px" class="my-3">
    <button mat-raised-button color="primary" class="button-lg" (click)="goToImageModeFromIntro()">
      <mat-icon>image</mat-icon> Image
    </button>

    <button mat-raised-button color="primary" (click)="goToPromptMode()">
      <mat-icon>edit</mat-icon> Text
    </button>
  </div>
</div>

<div class="mt-2" *ngIf="currentMode === Mode.Prompt">
  <app-text-mode [initialPrompt]="promptText" (saveRequested)="onSaveRequested($event)" [parentDialogRef]="parentDialogRef"></app-text-mode>
</div>

<div class="mt-2" *ngIf="currentMode === Mode.Image">
  <app-image-mode 
    [uploadedImageData]="uploadedImageData"
    (saveRequested)="onSaveRequested($event)" 
    [parentDialogRef]="parentDialogRef">
  </app-image-mode>
</div>
