name: Deploy Stage to Build Branch
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm install
      - name: Build for Stage
        if: github.repository == 'global-symbols/boardbuilder-internal'
        run: npm run build -- --configuration=stage --output-path=dist/boardbuilder
      - name: Deploy Stage to Build Branch
        if: github.repository == 'global-symbols/boardbuilder-internal'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/boardbuilder
          publish_branch: build-stage
